name: CI

on:
  push:
    branches: [master, real-photos-and-entrypoint]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, exif, fileinfo, pdo_sqlite, mbstring
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run the test suite
        run: php tests/run.php
