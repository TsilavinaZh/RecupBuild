<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F6F3EC" />
    <meta
      name="description"
      content="RecupBuild transforme la photo d'un tas de matériaux de récupération en plan de construction."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RecupBuild</title>
    <!--
      The loading screen of the entry point: inline, so it shows before any script or
      stylesheet arrives. A plank is sawn along a copper line while a tape measure runs
      underneath. src/main.ts fades it out once the app is ready.
    -->
    <style>#boot{z-index:100;background-color:#f6f3ec;background-image:linear-gradient(90deg,#2f6b4f12 1px,#0000 1px),linear-gradient(#2f6b4f12 1px,#0000 1px);background-size:40px 40px;place-items:center;transition:opacity .35s,visibility .35s;display:grid;position:fixed;inset:0}#boot.done{opacity:0;visibility:hidden}#boot .bench{width:min(300px,78vw)}#boot svg{width:100%;height:auto;display:block;overflow:visible}#boot .cut{stroke-dasharray:6 4;animation:1.6s cubic-bezier(.6,0,.3,1) infinite boot-cut}#boot .blade{animation:1.6s cubic-bezier(.6,0,.3,1) infinite boot-blade}#boot .dust{animation:1.6s ease-out infinite boot-dust}#boot .tape{background:repeating-linear-gradient(90deg,#1f2a24 0 1px,#0000 1px 6px) top/100% 40% no-repeat,repeating-linear-gradient(90deg,#1f2a24 0 1.5px,#0000 1.5px 30px) top/100% 70% no-repeat,#e6cba4;border-radius:3px;height:10px;margin:14px 5.7% 0 5%;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #7f7b6b}#boot .tape:after{content:"";transform-origin:0;background:#2f6b4f8c;animation:1.6s cubic-bezier(.6,0,.3,1) infinite boot-tape;position:absolute;inset:0}#boot .name{text-align:center;letter-spacing:.18em;text-transform:uppercase;color:#4a5750;margin:18px 0 0;font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes boot-cut{0%{clip-path:inset(0 100% 0 0)}70%,to{clip-path:inset(0)}}@keyframes boot-blade{0%{opacity:1;transform:translate(0)}70%{opacity:1;transform:translate(248px)}85%,to{opacity:0;transform:translate(248px)}}@keyframes boot-dust{0%,10%{opacity:0;transform:translate(0)}40%{opacity:.8}to{opacity:0;transform:translate(-14px,12px)}}@keyframes boot-tape{0%{transform:scaleX(0)}70%,to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){#boot .cut,#boot .blade,#boot .dust,#boot .tape:after{animation:none}#boot .blade{display:none}}</style>
    <script type="module" crossorigin src="/assets/index-BGLZucz3.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/button-Bi4nNpGW.js">
    <link rel="modulepreload" crossorigin href="/assets/dist-DuRvuWjz.js">
    <link rel="stylesheet" crossorigin href="/assets/index-Dn7IEjN7.css">
  </head>
  <body>
    <div id="boot" role="status" aria-label="Chargement de RecupBuild / Loading RecupBuild">
      <div class="bench" aria-hidden="true">
        <svg viewBox="0 0 280 70">
          <!-- The plank, its shadow, its grain and a knot. -->
          <rect x="18" y="18" width="250" height="40" rx="2" fill="#1f2a24" opacity="0.12" />
          <rect x="14" y="14" width="250" height="40" rx="2" fill="#c99a66" />
          <path d="M14 22 Q80 19 140 23 T264 21 M14 31 Q70 34 120 30 T264 32 M14 41 Q90 38 160 42 T264 40 M14 49 Q60 51 130 48 T264 50" fill="none" stroke="#7b4f2a" stroke-width="1" opacity="0.35" />
          <ellipse cx="196" cy="34" rx="7" ry="3.5" fill="#7b4f2a" opacity="0.5" />
          <rect x="14" y="14" width="250" height="40" rx="2" fill="none" stroke="#1f2a24" stroke-opacity="0.35" />
          <!-- The line being sawn. -->
          <line class="cut" x1="14" y1="34" x2="264" y2="34" stroke="#c4622d" stroke-width="2.5" />
          <!-- The saw tooth travelling along it, throwing a little dust. -->
          <g class="blade">
            <path d="M10 22 L18 34 L10 46" fill="none" stroke="#1f2a24" stroke-width="2.5" stroke-linejoin="round" />
            <circle class="dust" cx="10" cy="40" r="1.6" fill="#9c6a3c" />
            <circle class="dust" cx="7" cy="36" r="1.2" fill="#9c6a3c" style="animation-delay: 0.2s" />
          </g>
        </svg>
        <div class="tape"></div>
        <p class="name">RecupBuild</p>
      </div>
    </div>
    <div id="app"></div>
    <noscript>
      <style>#boot{display:none}</style>
      <p style="padding: 1rem; font-family: sans-serif">
        RecupBuild a besoin de JavaScript pour fonctionner. / RecupBuild needs JavaScript to run.
      </p>
    </noscript>
  </body>
</html>
