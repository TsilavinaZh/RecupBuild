<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" fill="none"><style>
.fl{animation:fl 7s ease-in-out infinite}
.fl2{animation:fl 9s ease-in-out -3s infinite}
.fl3{animation:fl 8s ease-in-out -5.5s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 3.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.march{animation:march 2.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-11}}
.scan{animation:scan 5s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--h,300px));opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 7s ease-out infinite both;animation-delay:var(--d,0s)}
@keyframes pop{0%,6%{transform:scale(0);opacity:0}14%{transform:scale(1.18);opacity:1}20%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.slot{transform-box:fill-box;transform-origin:center;animation:slot 9s cubic-bezier(.25,.75,.3,1) infinite both;animation-delay:var(--d,0s)}
@keyframes slot{0%{transform:translate(var(--dx,-300px),var(--dy,0px)) rotate(var(--r,0deg));opacity:0}6%{opacity:1}24%,84%{transform:translate(0,0) rotate(0deg);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}
.rise{animation:rise 7s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--up,-14px))}}
.draw{animation:draw 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes draw{0%,10%{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60)}40%,85%{stroke-dasharray:var(--len,60);stroke-dashoffset:0}100%{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.search{animation:search 6s ease-in-out infinite}
@keyframes search{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,10px)}}
.travel{animation:travel 7s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0)}45%,60%{transform:translateX(var(--w,480px))}100%{transform:translateX(0)}}
.wobble{transform-box:fill-box;transform-origin:center;animation:wobble 6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="g8" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#1F2A24" stroke-opacity="0.045" stroke-width="1"/></pattern><pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2F6B4F" stroke-opacity="0.09" stroke-width="1"/></pattern></defs><rect width="640" height="380" fill="url(#g8)"/><rect width="640" height="380" fill="url(#g40)"/><circle cx="200" cy="220" r="130" fill="#e7ebe4"/><ellipse cx="160" cy="348" rx="56" ry="8" fill="#1F2A24" opacity="0.09"/><ellipse cx="508" cy="346" rx="80" ry="9" fill="#1F2A24" opacity="0.09"/><circle cx="508" cy="222" r="92" fill="#dae2da" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="508" cy="222" rx="92" ry="30" stroke="#1F2A24" stroke-width="2.5"/><path d="M416 222H600M508 130V314" stroke="#1F2A24" stroke-width="2.5"/><g class="wobble"><ellipse cx="508" cy="222" rx="46" ry="92" stroke="#2F6B4F" stroke-width="3"/></g><circle cx="548" cy="186" r="9" fill="#C4622D" stroke="#1F2A24" stroke-width="3" class="beat"/><g class="beat"><path d="M238 52H392A18 18 0 0 1 410 70V146A18 18 0 0 1 392 164H286L258 190L262 164H238A18 18 0 0 1 220 146V70A18 18 0 0 1 238 52Z" fill="#FBF9F4" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M296 92Q296 74 316 74Q336 74 336 92Q336 104 322 110Q316 113 316 124" stroke="#C4622D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="316" cy="142" r="6" fill="#C4622D"/></g><g transform="translate(150 344) scale(1 1)"><path d="M-8 -108L-10 -56L-12 -8" stroke="#1F2A24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -108L-10 -56L-12 -8" stroke="#474f49" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="-19" y="-10" width="22" height="10" rx="5" fill="#1F2A24"/><path d="M-13 -170L-20 -136L-22 -100" stroke="#1F2A24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M-13 -170L-20 -136L-22 -100" stroke="#c6a98f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-22" cy="-100" r="7.5" fill="#d6a17e" stroke="#1F2A24" stroke-width="3"/><rect x="-6" y="-192" width="13" height="18" rx="4" fill="#d6a17e" stroke="#1F2A24" stroke-width="3"/><path d="M-25 -174Q0 -186 25 -174L22 -104Q0 -98 -22 -104Z" fill="#ddba9e" stroke="#1F2A24" stroke-width="3" stroke-linejoin="round"/><path d="M8 -108L10 -56L12 -8" stroke="#1F2A24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -108L10 -56L12 -8" stroke="#4e5650" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="-10" width="22" height="10" rx="5" fill="#1F2A24"/><circle cx="2" cy="-208" r="18.5" fill="#d6a17e" stroke="#1F2A24" stroke-width="3"/><path d="M-16.5 -206A18.5 18.5 0 0 1 20.5 -210Q12 -220 2 -219Q-10 -218 -16.5 -206Z" fill="#614028" stroke="#1F2A24" stroke-width="3" stroke-linejoin="round"/><path d="M13 -170L36 -192L34 -230" stroke="#1F2A24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 -170L36 -192L34 -230" stroke="#ddba9e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="-230" r="7.5" fill="#d6a17e" stroke="#1F2A24" stroke-width="3"/></g></svg>
