ound"/></g></g><g class="sway"><g transform="translate(482.5 181) rotate(-4)"><rect x="-48.3" y="-68.3" width="96.6" height="136.6" rx="5" fill="#1F2A24" opacity="0.1"/></g><g transform="translate(478 175) rotate(-4)"><rect x="-48.3" y="-68.3" width="96.6" height="136.6" rx="4" fill="#FBF9F4" stroke="#1F2A24" stroke-width="3"/><rect x="-34.8" y="-43.7" width="40.6" height="3" rx="2" fill="#D6C9AF"/><rect x="-34.8" y="-27.3" width="58" height="3" rx="2" fill="#D6C9AF"/><rect x="-34.8" y="-13.7" width="46.4" height="3" rx="2" fill="#D6C9AF"/><rect x="-34.8" y="0" width="69.6" height="3" rx="2" fill="#D6C9AF"/><rect x="-34.8" y="13.7" width="58" height="3" rx="2" fill="#D6C9AF"/><rect x="-34.8" y="27.3" width="46.4" height="3" rx="2" fill="#D6C9AF"/></g></g><rect x="46" y="44" width="548" height="292" rx="14" fill="none" stroke="#2F6B4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10" class="march"/><path d="M46 84V58a14 14 0 0 1 14-14h26" stroke="#C4622D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><path d="M554 44h26a14 14 0 0 1 14 14v26" stroke="#C4622D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><path d="M594 296v26a14 14 0 0 1-14 14h-26" stroke="#C4622D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><path d="M86 336h-26a14 14 0 0 1-14-14v-26" stroke="#C4622D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><path d="M320 44v18M320 318v18M46 190h18M576 190h18" stroke="#2F6B4F" stroke-width="3" stroke-linecap="round"/></svg>
