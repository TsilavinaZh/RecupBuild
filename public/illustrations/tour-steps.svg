roke-linejoin="round"/><rect x="590" y="107" width="20" height="26" rx="3" stroke="#1F2A24" stroke-width="3"/><path d="M595 121l4 4 7-8" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="214" y="164" width="52" height="8" rx="4" fill="#D6C9AF"/><rect x="304" y="164" width="52" height="8" rx="4" fill="#D6C9AF"/><rect x="394" y="164" width="52" height="8" rx="4" fill="#D6C9AF"/><rect x="484" y="164" width="52" height="8" rx="4" fill="#D6C9AF"/><rect x="574" y="164" width="52" height="8" rx="4" fill="#D6C9AF"/><g class="travel" style="--w:360px"><circle cx="240" cy="120" r="9" fill="#C4622D" stroke="#1F2A24" stroke-width="3"/></g><g transform="translate(128 348) scale(0.98 0.98)"><path d="M-8 -108L-12 -56L-18 -8" stroke="#1F2A24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -108L-12 -56L-18 -8" stroke="#474f49" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="-25" y="-10" width="22" height="10" rx="5" fill="#1F2A24"/><path d="M-13 -170L-20 -136L-22 -100" stroke="#1F2A24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M-13 -170L-20 -136L-22 -100" stroke="#2d634a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-22" cy="-100" r="7.5" fill="#ad5a2c" stroke="#1F2A24" stroke-width="3"/><rect x="-6" y="-192" width="13" height="18" rx="4" fill="#ad5a2c" stroke="#1F2A24" stroke-width="3"/><path d="M-25 -174Q0 -186 25 -174L22 -104Q0 -98 -22 -104Z" fill="#2F6B4F" stroke="#1F2A24" stroke-width="3" stroke-linejoin="round"/><path d="M8 -108L12 -56L18 -8" stroke="#1F2A24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -108L12 -56L18 -8" stroke="#4e5650" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="11" y="-10" width="22" height="10" rx="5" fill="#1F2A24"/><circle cx="2" cy="-208" r="18.5" fill="#ad5a2c" stroke="#1F2A24" stroke-width="3"/><path d="M-18 -204A19 19 0