C4622D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5" class="march"/></g><g transform="translate(512 150) rotate(5)"><g class="pop" style="--d:2.7s"><circle cx="-55" cy="0" r="15" fill="#FBF9F4" stroke="#1F2A24" stroke-width="3"/><circle cx="-55" cy="0" r="5.1" fill="#C4622D"/></g></g></g><g class="fl"><g transform="translate(490.5 298) rotate(-2)"><rect x="-120" y="-12" width="240" height="24" rx="5" fill="#1F2A24" opacity="0.1"/></g><g transform="translate(486 292) rotate(-2)"><rect x="-120" y="-12" width="240" height="24" rx="4" fill="#ddab8d" stroke="#1F2A24" stroke-width="3"/><path d="M-104.7 0H67.5" fill="none" stroke="#C4622D" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/></g><g transform="translate(486 292) rotate(-2)"><rect x="-127" y="-19" width="254" height="38" rx="9" fill="none" stroke="#C4622D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5" class="march"/></g><g transform="translate(486 292) rotate(-2)"><g class="pop" style="--d:3.6s"><circle cx="-90" cy="0" r="15" fill="#FBF9F4" stroke="#1F2A24" stroke-width="3"/><circle cx="-90" cy="0" r="5.1" fill="#C4622D"/></g></g></g></svg>
