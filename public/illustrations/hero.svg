und"/><g transform="translate(44 -170) rotate(18)"><rect x="-11" y="-20" width="22" height="40" rx="5" fill="#1F2A24"/><rect x="-7.5" y="-15" width="15" height="28" rx="2.5" fill="#b4c7ba" class="pulse"/></g><path d="M13 -170L30 -140L46 -158" stroke="#1F2A24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 -170L30 -140L46 -158" stroke="#2F6B4F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="-158" r="7.5" fill="#ad5a2c" stroke="#1F2A24" stroke-width="3"/></g><circle cx="228" cy="160" r="12" fill="#C4622D" opacity="0.5" class="ripple"/></svg>
