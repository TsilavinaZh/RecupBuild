roke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M99.6 154.9L121.9 167.8" stroke="#1F2A24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M99.6 146.2L121.9 159.2" stroke="#1F2A24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M99.6 137.6L121.9 150.6" stroke="#1F2A24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
