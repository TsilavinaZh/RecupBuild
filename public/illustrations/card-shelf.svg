<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none"><style>
.fl{animation:fl 7s ease-in-out infinite}
.fl2{animation:fl 9s ease-in-out -3s infinite}
.fl3{animation:fl 8s ease-in-out -5.5s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 3.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.march{animation:march 2.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-11}}
.scan{animation:scan 5s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--h,300px));opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 7s ease-out infinite both;animation-delay:var(--d,0s)}
@keyframes pop{0%,6%{transform:scale(0);opacity:0}14%{transform:scale(1.18);opacity:1}20%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.slot{transform-box:fill-box;transform-origin:center;animation:slot 9s cubic-bezier(.25,.75,.3,1) infinite both;animation-delay:var(--d,0s)}
@keyframes slot{0%{transform:translate(var(--dx,-300px),var(--dy,0px)) rotate(var(--r,0deg));opacity:0}6%{opacity:1}24%,84%{transform:translate(0,0) rotate(0deg);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}
.rise{animation:rise 7s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--up,-14px))}}
.draw{animation:draw 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes draw{0%,10%{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60)}40%,85%{stroke-dasharray:var(--len,60);stroke-dashoffset:0}100%{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.search{animation:search 6s ease-in-out infinite}
@keyframes search{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,10px)}}
.travel{animation:travel 7s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0)}45%,60%{transform:translateX(var(--w,480px))}100%{transform:translateX(0)}}
.wobble{transform-box:fill-box;transform-origin:center;animation:wobble 6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
