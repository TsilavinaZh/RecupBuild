<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none"><style>
.fl{animation:fl 7s ease-in-out infinite}
.fl2{animation:fl 9s ease-in-out -3s infinite}
.fl3{animation:fl 8s ease-in-out -5.5s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 3.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.march{animation:march 2.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-11}}
.scan{animation:scan 5s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--h,300px));opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 7s ease-out infinite both;animation-delay:var(--d,0s)}
@keyframes pop{0%,6%{transform:scale(0);opacity:0}14%{transform:scale(1.18);opacity:1}20%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.slot{transform-box:fill-box;transform-origin:center;animation:slot 9s cubic-bezier(.25,.75,.3,1) infinite both;animation-delay:var(--d,0s)}
@keyframes slot{0%{transform:translate(var(--dx,-300px),var(--dy,0px)) rotate(var(--r,0deg));opacity:0}6%{opacity:1}24%,84%{transform:translate(0,0) rotate(0deg);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}
.rise{animation:rise 7s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--up,-14px))}}
.draw{animation:draw 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes draw{0%,10%{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60)}40%,85%{stroke-dasharray:var(--len,60);stroke-dashoffset:0}100%{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.search{animation:search 6s ease-in-out infinite}
@keyframes search{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,10px)}}
.travel{animation:travel 7s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0)}45%,60%{transform:translateX(var(--w,480px))}100%{transform:translateX(0)}}
.wobble{transform-box:fill-box;transform-origin:center;animation:wobble 6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="g8" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#1F2A24" stroke-opacity="0.045" stroke-width="1"/></pattern><pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2F6B4F" stroke-opacity="0.09" stroke-width="1"/></pattern></defs><rect width="640" height="300" fill="url(#g8)"/><rect width="640" height="300" fill="url(#g40)"/><circle cx="420" cy="170" r="128" fill="#e7ebe4"/><ellipse cx="150" cy="292" rx="60" ry="8" fill="#1F2A24" opacity="0.09"/><ellipse cx="400" cy="292" rx="210" ry="9" fill="#1F2A24" opacity="0.09"/><rect x="200" y="196" width="400" height="16" rx="4" fill="#e0b296" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 212V288M578 212V288M246 212V288M554 212V288" stroke="#1F2A24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 212V288M578 212V288M246 212V288M554 212V288" stroke="#e0b296" stroke-width="3" stroke-linecap="round"/><rect x="236" y="172" width="330" height="24" rx="4" fill="#e7c8b3" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 184H384.5M417.5 185H550" stroke="#C4622D" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round"/><path d="M470 196H540L548 188H478Z" fill="#FBF9F4" stroke="#1F2A24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="pulse"><path d="M236 150H566" stroke="#C4622D" stroke-width="2.5" stroke-linecap="round"/><path d="M236 142v16M566 142v16" stroke="#C4622D" stroke-width="2.5" stroke-linecap="round"/><path d="M246 144l-10 6 10 6M556 144l10 6-10 6" stroke="#C4622D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(136 288) scale(0.96 0.96)"><path d="M-8 -108L-16 -56L-26 -8" stroke="#1F2A24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -108L-16 -56L-26 -8" stroke="#474f49" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="-33" y="-10" width="22" height="10" rx="5" fill="#1F2A24"/><path d="M-13 -170L10 -132L44 -112" stroke="#1F2A24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M-13 -170L10 -132L44 -112" stroke="#c8ae97" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="-112" r="7.5" fill="#854d2a" stroke="#1F2A24" stroke-width="3"/><rect x="-6" y="-192" width="13" height="18" rx="4" fill="#854d2a" stroke="#1F2A24" stroke-width="3"/><path d="M-25 -174Q0 -186 25 -174L22 -104Q0 -98 -22 -104Z" fill="#dfc0a7" stroke="#1F2A24" stroke-width="3" stroke-linejoin="round"/><path d="M8 -108L16 -56L22 -8" stroke="#1F2A24" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -108L16 -56L22 -8" stroke="#4e5650" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="-10" width="22" height="10" rx="5" fill="#1F2A24"/><circle cx="2" cy="-208" r="18.5" fill="#854d2a" stroke="#1F2A24" stroke-width="3"/><path d="M-17 -207A18.5 18.5 0 0 1 20 -210Z" fill="#C4622D" stroke="#1F2A24" stroke-width="3" stroke-linejoin="round"/><path d="M14 -211H32Q34 -207 30 -206H18" fill="#C4622D" stroke="#1F2A24" stroke-width="3" stroke-linejoin="round"/><path d="M13 -170L36 -134L74 -114" stroke="#1F2A24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 -170L36 -134L74 -114" stroke="#dfc0a7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="-114" r="7.5" fill="#854d2a" stroke="#1F2A24" stroke-width="3"/></g><path d="M226 184H330" stroke="#C4622D" stroke-width="5" stroke-linecap="round"/><path d="M246 181v6M266 181v6M286 181v6M306 181v6" stroke="#F6F3EC" stroke-width="1.5"/></svg>
